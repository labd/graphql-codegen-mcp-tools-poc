<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 520" fill="none">
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif; }
    .label { font-size: 15px; font-weight: 700; fill: #1a1a1a; }
    .sublabel { font-size: 12px; font-weight: 400; fill: #78716C; }
    .connector-label { font-size: 11px; font-weight: 500; fill: #78716C; }
    .box { rx: 16; ry: 16; stroke-width: 2; }
    .arrow { stroke: #d4d4d4; stroke-width: 2; fill: none; }
    .arrowhead { fill: #d4d4d4; }
  </style>

  <!-- AI Assistant -->
  <rect class="box" x="220" y="20" width="280" height="72" fill="#FFF7ED" stroke="#FF781E"/>
  <text class="label" x="360" y="50" text-anchor="middle">AI Assistant</text>
  <text class="sublabel" x="360" y="70" text-anchor="middle">Claude Desktop, chat widget, agent</text>

  <!-- Connector 1 -->
  <line class="arrow" x1="360" y1="92" x2="360" y2="148"/>
  <polygon class="arrowhead" points="354,144 360,156 366,144"/>
  <text class="connector-label" x="374" y="126" text-anchor="start">Streamable HTTP</text>

  <!-- MCP Server -->
  <rect class="box" x="220" y="156" width="280" height="72" fill="#ffffff" stroke="#e5e5e5"/>
  <text class="label" x="360" y="186" text-anchor="middle">MCP Server</text>
  <text class="sublabel" x="360" y="206" text-anchor="middle">Generated tools &middot; JSON Schema validation</text>

  <!-- Connector 2 -->
  <line class="arrow" x1="360" y1="228" x2="360" y2="284"/>
  <polygon class="arrowhead" points="354,280 360,292 366,280"/>
  <text class="connector-label" x="374" y="250" text-anchor="start">HTTP POST /graphql</text>
  <text class="connector-label" x="374" y="266" text-anchor="start">persisted document ID</text>

  <!-- GraphQL Server -->
  <rect class="box" x="220" y="292" width="280" height="72" fill="#ffffff" stroke="#e5e5e5"/>
  <text class="label" x="360" y="322" text-anchor="middle">GraphQL Server</text>
  <text class="sublabel" x="360" y="342" text-anchor="middle">Single schema or federated gateway</text>

  <!-- Connector 3 - fan out -->
  <line class="arrow" x1="360" y1="364" x2="360" y2="400"/>

  <!-- Three backend services -->
  <line class="arrow" x1="360" y1="400" x2="140" y2="400"/>
  <line class="arrow" x1="140" y1="400" x2="140" y2="432"/>
  <polygon class="arrowhead" points="134,428 140,440 146,428"/>

  <line class="arrow" x1="360" y1="400" x2="360" y2="432"/>
  <polygon class="arrowhead" points="354,428 360,440 366,428"/>

  <line class="arrow" x1="360" y1="400" x2="580" y2="400"/>
  <line class="arrow" x1="580" y1="400" x2="580" y2="432"/>
  <polygon class="arrowhead" points="574,428 580,440 586,428"/>

  <rect class="box" x="50" y="440" width="180" height="56" fill="#F5F5F5" stroke="#e5e5e5"/>
  <text class="label" x="140" y="465" text-anchor="middle" style="font-size:13px">Catalog</text>
  <text class="sublabel" x="140" y="481" text-anchor="middle">productSearch</text>

  <rect class="box" x="270" y="440" width="180" height="56" fill="#F5F5F5" stroke="#e5e5e5"/>
  <text class="label" x="360" y="465" text-anchor="middle" style="font-size:13px">Checkout</text>
  <text class="sublabel" x="360" y="481" text-anchor="middle">cartAddLineItems</text>

  <rect class="box" x="490" y="440" width="180" height="56" fill="#F5F5F5" stroke="#e5e5e5"/>
  <text class="label" x="580" y="465" text-anchor="middle" style="font-size:13px">Orders</text>
  <text class="sublabel" x="580" y="481" text-anchor="middle">orderHistory</text>

  <!-- Codegen side annotation -->
  <rect x="560" y="130" width="148" height="120" rx="12" ry="12" fill="#FFF7ED" stroke="#FF781E" stroke-width="1.5" stroke-dasharray="6 3"/>
  <text x="634" y="156" text-anchor="middle" style="font-size:11px; font-weight:700; fill:#FF781E;">Build time</text>
  <text x="634" y="176" text-anchor="middle" style="font-size:11px; fill:#78716C;">persisted-documents.json</text>
  <text x="634" y="194" text-anchor="middle" style="font-size:11px; fill:#78716C;">mcp-tools.generated.ts</text>
  <text x="634" y="218" text-anchor="middle" style="font-size:10px; fill:#78716C;">@mcpTool directives</text>
  <text x="634" y="232" text-anchor="middle" style="font-size:10px; fill:#78716C;">&#x2192; JSON Schema</text>

  <!-- Dashed line from codegen to MCP Server -->
  <line x1="560" y1="192" x2="504" y2="192" stroke="#FF781E" stroke-width="1.5" stroke-dasharray="6 3"/>
  <polygon points="508,188 500,192 508,196" fill="#FF781E"/>

</svg>
